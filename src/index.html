<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    .show {
      display: block;

    }

    .fade {
      display: none;
    }
  </style>
</head>
<body>

<div class="container pt-4">
  <div class="row">
    <form>
      <div class="mb-3">
        <label for="text" class="form-label">Note text</label>
        <textarea class="form-control" id="text" aria-describedby="textValidationMessage"></textarea>
        <div id="textValidationMessage" class="invalid-feedback">We'll never share your email with anyone else.</div>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>

<div class="container">
  <div class="row">
    <div class="col-8 offset-2">

    </div>
  </div>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form action="" class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Edit note</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="edit-text" class="form-label">Note text</label>
          <textarea class="form-control modal-text" id="edit-text" aria-describedby="edit"></textarea>
          <div id="edit" class="invalid-feedback">We'll never share your email with anyone else.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary button-close" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary button-change">Save changes</button>
      </div>
    </form>
  </div>
</div>

  <script src="refactoring/refactor_Index.js" type="module"></script>
</body>
</html>
